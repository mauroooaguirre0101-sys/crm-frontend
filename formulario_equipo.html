<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Semanal — Equipo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090e;--surface:#111118;--surface-2:#17171f;--surface-3:#1d1d27;--line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.11);--text:#e8e9f0;--text2:#8890a8;--text3:#4e5068;--gold:#e0b54a;--gold-border:rgba(224,181,74,.24);--green:#4ade80;--red:#ef4444;--rs:10px}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 60px}
.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;padding:28px;margin-bottom:20px}
.card-header{margin-bottom:24px}
.card-title{font-size:20px;font-weight:800;color:var(--text)}
.card-sub{font-size:12px;color:var(--text3);margin-top:4px}
.week-badge{display:inline-block;background:rgba(224,181,74,.12);border:1px solid var(--gold-border);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-top:8px}
.form-group{margin-bottom:22px}
.form-label{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:7px}
.form-input{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--gold)}
.q-block{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.q-num{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.q-text{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;line-height:1.4}
.q-obligatoria{color:var(--red);margin-left:3px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-item{display:flex;align-items:center;gap:10px;background:var(--surface-3);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;transition:all .15s}
.opt-item:hover{border-color:var(--gold);background:rgba(224,181,74,.05)}
.opt-item.selected{border-color:var(--gold);background:rgba(224,181,74,.1)}
.opt-item input[type=radio],.opt-item input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px;flex-shrink:0;cursor:pointer}
.opt-label{font-size:13px;color:var(--text);cursor:pointer;flex:1}
.otros-input{width:100%;background:var(--surface-3);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;margin-top:6px;display:none}
.otros-input:focus{border-color:var(--gold)}
textarea.form-input{resize:vertical;min-height:80px}
input[type=number].form-input{-moz-appearance:textfield}
.btn-submit{width:100%;background:linear-gradient(135deg,var(--gold),#c89732);color:#000;font-family:inherit;font-size:14px;font-weight:800;padding:14px;border:none;border-radius:10px;cursor:pointer;transition:opacity .15s}
.btn-submit:hover{opacity:.9}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.err-msg{display:none;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--red);margin-top:8px}
.success-card{text-align:center;padding:40px 20px}
.success-icon{font-size:48px;margin-bottom:16px}
.success-title{font-size:20px;font-weight:800;color:var(--green);margin-bottom:8px}
.success-sub{font-size:13px;color:var(--text3)}
.already-card{text-align:center;padding:40px 20px}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="card" style="text-align:center;padding:40px;color:var(--text3)">Cargando formulario...</div>
  <div id="form-container" style="display:none">
    <div class="card card-header" style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:14px">
        <img id="h-foto" src="" alt="" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--line-strong);display:none">
        <div>
          <div class="card-title" id="h-nombre">—</div>
          <div class="card-sub" id="h-rol"></div>
          <div class="week-badge" id="h-semana"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div id="questions-container"></div>
      <button class="btn-submit" id="btn-submit" onclick="submitForm()">Enviar Reporte ✓</button>
    </div>
  </div>
  <div id="success-card" class="card success-card" style="display:none">
    <div class="success-icon">✅</div>
    <div class="success-title">¡Reporte enviado!</div>
    <div class="success-sub">Tu reporte de la semana fue registrado correctamente.</div>
  </div>
  <div id="already-card" class="card already-card" style="display:none">
    <div style="font-size:36px;margin-bottom:16px">📋</div>
    <div style="font-size:17px;font-weight:700;color:var(--gold);margin-bottom:8px">Ya enviaste tu reporte</div>
    <div style="font-size:13px;color:var(--text3)">Ya completaste el formulario de esta semana. Volvé la próxima semana.</div>
  </div>
  <div id="error-card" class="card" style="display:none;text-align:center;padding:40px 20px">
    <div style="font-size:36px;margin-bottom:12px">❌</div>
    <div style="font-size:14px;color:var(--red);font-weight:600" id="error-msg">Error al cargar el formulario</div>
  </div>
</div>

<script>
const API_URL = 'https://noble-determination-production.up.railway.app';
let _miembro = null, _formulario = null, _semana = 0, _mes = 0, _anio = 0, _tipo = 'semanal', _fecha = '';

function getWeekOfMonth(date){ return Math.min(4, Math.ceil(date.getDate() / 7)); }
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

async function init(){
  const params = new URLSearchParams(location.search);
  const miembroId = params.get('miembro_id');
  if(!miembroId){ showError('Link inválido. Pedile el link correcto al administrador.'); return; }

  try{
    const r = await fetch(`${API_URL}/holding/miembro-publico/${miembroId}`);
    if(!r.ok){ showError('Miembro no encontrado.'); return; }
    const data = await r.json();
    _miembro = data.miembro;

    // Determine tipo from URL param or from form's tipo field
    _tipo = params.get('tipo') || 'semanal';
    const now = new Date();
    _fecha = params.get('fecha') || now.toISOString().slice(0,10);
    _mes = now.getMonth();
    _anio = now.getFullYear();
    _semana = getWeekOfMonth(now);

    // Find the right form based on tipo
    const { data: forms } = await (async()=>{
      const fr = await fetch(`${API_URL}/holding/miembro-publico/${miembroId}`);
      return fr.ok ? fr.json() : { miembro: null, formulario: null };
    })();
    // Use the formulario from the data, but prefer matching tipo
    _formulario = null;
    // Fetch all forms for this member via public endpoint
    const allFormsR = await fetch(`${API_URL}/holding/formularios-publico?miembro_id=${miembroId}`);
    if(allFormsR.ok){
      const allForms = await allFormsR.json();
      _formulario = allForms.find(f=>f.tipo===_tipo) || allForms[0] || null;
    } else {
      _formulario = data.formulario;
    }

    if(!_formulario){ showError('No tenés un formulario asignado. Contactá al administrador.'); return; }

    // Check if already submitted
    let alreadySubmitted = false;
    if(_tipo === 'daily'){
      const rCheck = await fetch(`${API_URL}/holding/respuestas?miembro_id=${_miembro.id}&fecha=${_fecha}`);
      if(rCheck.ok){ const reps = await rCheck.json(); alreadySubmitted = reps.length > 0; }
    } else {
      const rCheck = await fetch(`${API_URL}/holding/respuestas?miembro_id=${_miembro.id}&mes=${_mes}&anio=${_anio}`);
      if(rCheck.ok){ const reps = await rCheck.json(); alreadySubmitted = !!reps.find(r=>r.semana===_semana); }
    }
    if(alreadySubmitted){
      document.getElementById('loading').style.display='none';
      document.getElementById('already-card').style.display='block';
      return;
    }

    renderForm();
  } catch(e){
    showError('Error de red. Intentá de nuevo más tarde.');
  }
}

function showError(msg){
  document.getElementById('loading').style.display='none';
  document.getElementById('error-msg').textContent=msg;
  document.getElementById('error-card').style.display='block';
}

function renderForm(){
  document.getElementById('loading').style.display='none';
  document.getElementById('form-container').style.display='block';

  const foto = document.getElementById('h-foto');
  if(_miembro.foto_url){ foto.src=_miembro.foto_url; foto.style.display='block'; }
  document.getElementById('h-nombre').textContent=_miembro.nombre;
  document.getElementById('h-rol').textContent=_miembro.rol||'';
  if(_tipo==='daily'){
    const d=new Date(_fecha+'T12:00:00');
    document.getElementById('h-semana').textContent=`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()} — Daily`;
  } else {
    document.getElementById('h-semana').textContent=`Semana ${_semana} — ${MESES[_mes]} ${_anio}`;
  }

  const preguntas = _formulario.preguntas || [];
  const qc = document.getElementById('questions-container');

  qc.innerHTML = preguntas.map((q, idx) => {
    let inputHtml = '';
    if(q.tipo==='textarea'){
      inputHtml=`<textarea class="form-input" id="resp-${q.id}" rows="3" placeholder="Tu respuesta..."></textarea>`;
    } else if(q.tipo==='number'){
      inputHtml=`<input type="number" class="form-input" id="resp-${q.id}" placeholder="0">`;
    } else {
      const optsHtml = (q.opciones||[]).map((op,oi)=>{
        const inputType = q.tipo==='checkbox'?'checkbox':'radio';
        const name = q.tipo==='radio'?`name="rg-${q.id}"`:'';
        return `<label class="opt-item" id="opt-${q.id}-${oi}" onclick="selectOpt('${q.id}',${oi},'${q.tipo}')">
          <input type="${inputType}" ${name} id="inp-${q.id}-${oi}" value="${op.replace(/"/g,'&quot;')}" onclick="event.stopPropagation();selectOpt('${q.id}',${oi},'${q.tipo}')">
          <span class="opt-label">${op}</span>
        </label>`;
      }).join('');
      const otrosHtml = q.otros ? `
        <label class="opt-item" id="opt-${q.id}-otros" onclick="selectOtros('${q.id}','${q.tipo}')">
          <input type="${q.tipo==='checkbox'?'checkbox':'radio'}" ${q.tipo==='radio'?`name="rg-${q.id}"`:''}  id="inp-${q.id}-otros" onclick="event.stopPropagation();selectOtros('${q.id}','${q.tipo}')">
          <span class="opt-label">Otros</span>
        </label>
        <input type="text" class="otros-input" id="otros-${q.id}" placeholder="Especificá...">` : '';
      inputHtml=`<div class="opt-list">${optsHtml}${otrosHtml}</div>`;
    }
    return `<div class="q-block">
      <div class="q-num">Pregunta ${idx+1}</div>
      <div class="q-text">${q.texto}${q.obligatoria?'<span class="q-obligatoria">*</span>':''}</div>
      ${inputHtml}
      <div class="err-msg" id="err-${q.id}">Esta pregunta es obligatoria.</div>
    </div>`;
  }).join('');
}

function selectOpt(qId, optIdx, tipo){
  const inp = document.getElementById(`inp-${qId}-${optIdx}`);
  if(tipo==='radio'){
    document.querySelectorAll(`[id^="opt-${qId}-"]`).forEach(el=>el.classList.remove('selected'));
    if(inp) inp.checked=true;
    document.getElementById(`opt-${qId}-${optIdx}`)?.classList.add('selected');
    const otrosEl=document.getElementById(`otros-${qId}`);
    if(otrosEl) otrosEl.style.display='none';
  } else {
    inp.checked=!inp.checked;
    document.getElementById(`opt-${qId}-${optIdx}`)?.classList.toggle('selected', inp.checked);
  }
}

function selectOtros(qId, tipo){
  const inp=document.getElementById(`inp-${qId}-otros`);
  const otrosEl=document.getElementById(`otros-${qId}`);
  if(tipo==='radio'){
    document.querySelectorAll(`[id^="opt-${qId}-"]`).forEach(el=>el.classList.remove('selected'));
    if(inp) inp.checked=true;
    document.getElementById(`opt-${qId}-otros`)?.classList.add('selected');
    if(otrosEl){ otrosEl.style.display='block'; otrosEl.focus(); }
  } else {
    inp.checked=!inp.checked;
    document.getElementById(`opt-${qId}-otros`)?.classList.toggle('selected', inp.checked);
    if(otrosEl) otrosEl.style.display=inp.checked?'block':'none';
  }
}

async function submitForm(){
  const preguntas = _formulario.preguntas || [];
  const respuestas = {};
  let hasError = false;

  preguntas.forEach(q => {
    const errEl = document.getElementById(`err-${q.id}`);
    if(errEl) errEl.style.display='none';

    if(q.tipo==='textarea'||q.tipo==='number'){
      const val=(document.getElementById(`resp-${q.id}`)?.value||'').trim();
      respuestas[q.id]=val;
      if(q.obligatoria&&!val){ if(errEl)errEl.style.display='block'; hasError=true; }
    } else if(q.tipo==='radio'){
      const checked=document.querySelector(`input[name="rg-${q.id}"]:checked`);
      if(checked){
        if(checked.id===`inp-${q.id}-otros`){
          const otrosVal=(document.getElementById(`otros-${q.id}`)?.value||'').trim();
          respuestas[q.id]='Otros';
          respuestas[q.id+'_otros']=otrosVal;
        } else {
          respuestas[q.id]=checked.value;
        }
      } else if(q.obligatoria){ if(errEl)errEl.style.display='block'; hasError=true; }
    } else if(q.tipo==='checkbox'){
      const checks=document.querySelectorAll(`[id^="inp-${q.id}-"]:checked`);
      const vals=[];
      checks.forEach(c=>{
        if(c.id===`inp-${q.id}-otros`){
          vals.push('Otros');
          const otrosVal=(document.getElementById(`otros-${q.id}`)?.value||'').trim();
          if(otrosVal) respuestas[q.id+'_otros']=otrosVal;
        } else { vals.push(c.value); }
      });
      respuestas[q.id]=vals;
      if(q.obligatoria&&!vals.length){ if(errEl)errEl.style.display='block'; hasError=true; }
    }
  });

  if(hasError){ document.querySelector('.err-msg[style*="block"]')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }

  const btn=document.getElementById('btn-submit');
  btn.disabled=true; btn.textContent='Enviando...';

  try{
    const r=await fetch(`${API_URL}/holding/respuestas`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({miembro_id:_miembro.id, formulario_id:_formulario.id, semana:_tipo==='daily'?null:_semana, mes:_mes, anio:_anio, respuestas, fecha:_tipo==='daily'?_fecha:null})
    });
    if(r.ok){
      document.getElementById('form-container').style.display='none';
      document.getElementById('success-card').style.display='block';
    } else {
      btn.disabled=false; btn.textContent='Enviar Reporte ✓';
    }
  } catch(e){ btn.disabled=false; btn.textContent='Enviar Reporte ✓'; }
}

init();
</script>
</body>
</html>
